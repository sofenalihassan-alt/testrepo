<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My dashboard · Dars</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="common.js"></script>
</head><body>
<header class="top"><div class="wrap"><h1><a href="dashboard.html">Dars · Farsi Class</a></h1>
<nav><a href="studio.html">Practice studio</a><a href="admin.html" id="adm" class="hide">Admin panel</a><button id="out">Sign out</button></nav></div></header>
<main><div class="wrap">
  <h2 id="hi">Welcome</h2>
  <div class="grid" style="margin-bottom:14px">
    <div class="stat"><b id="sx">0</b>XP</div>
    <div class="stat"><b id="ss">0</b>day streak</div>
    <div class="stat"><b id="sk">0</b>words known</div>
  </div>
  <div class="panel"><h3>Announcements</h3><div id="an"><p class="sub">Loading…</p></div></div>
  <div class="panel"><h3>Homework</h3><div id="as"><p class="sub">Loading…</p></div></div>
  <div class="panel"><h3>Practise words</h3>
    <div class="row" style="margin-top:0"><select id="cat" aria-label="Topic"></select>
      <button class="btn alt" data-m="cards" aria-pressed="true">Cards</button><button class="btn alt" data-m="quiz" aria-pressed="false">Quiz</button></div>
    <div class="bar" style="margin-top:10px"><i id="pb" style="width:0"></i></div><p class="sub" id="pt"></p>
    <div id="wb"></div>
  </div>
  <div class="panel"><h3>My settings</h3><div class="row" style="margin-top:0"><input id="nm" aria-label="Your name"><button class="btn alt" id="sn">Save name</button></div><label class="chk" style="margin-top:12px"><input type="checkbox" id="ne"> Email me when new homework or announcements are posted <span id="em" class="sub"></span></label></div>
</div></main>
<div id="toast" role="status"></div>
<script>
var U,P,WORDS=[],KNOWN={},pool=[],ix=0,flip=false,mode="cards",cur=null,done=false;
function stats(){$("sx").textContent=P.xp;$("ss").textContent=P.streak;$("sk").textContent=Object.keys(KNOWN).length}
async function addXp(n){var r=await sb.rpc("add_xp",{amount:n});if(r.error){toast(r.error.message);return}P.xp+=n;var t=new Date().toDateString();if(P.last_active!==new Date().toISOString().slice(0,10)){var f=await sb.from("profiles").select("streak,last_active").eq("id",U.id).single();if(f.data){P.streak=f.data.streak;P.last_active=f.data.last_active}}stats();toast("+"+n+" XP")}
async function init(){
  var u=await requireUser();if(!u)return;U=u.session.user;P=u.profile;
  $("hi").textContent="Welcome, "+(P.full_name||"student");$("nm").value=P.full_name||"";$("ne").checked=P.notify_email!==false;$("em").textContent="("+(U.email||"")+")";
  if(P.role==="admin")$("adm").classList.remove("hide");
  var r=await Promise.all([sb.from("words").select("*").order("created_at"),sb.from("known_words").select("word_id"),
    sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(5),
    sb.from("assignments").select("*").order("created_at",{ascending:false}).limit(10)]);
  WORDS=r[0].data||[];(r[1].data||[]).forEach(function(k){KNOWN[k.word_id]=1});
  var cats=[];WORDS.forEach(function(w){if(cats.indexOf(w.category)<0)cats.push(w.category)});
  $("cat").innerHTML='<option>All topics</option>'+cats.map(function(c){return "<option>"+esc(c)+"</option>"}).join("");
  $("an").innerHTML=(r[2].data||[]).length?r[2].data.map(function(a){return '<div style="margin-bottom:10px"><b>'+esc(a.title)+'</b> <span class="sub">'+new Date(a.created_at).toLocaleDateString()+'</span><div>'+esc(a.body||"")+'</div></div>'}).join(""):'<p class="sub">Nothing new.</p>';
  var as=(r[3].data||[]).filter(function(a){return !a.level||a.level===P.level});
  $("as").innerHTML=as.length?as.map(function(a){return '<div style="margin-bottom:10px"><b>'+esc(a.title)+'</b> '+(a.category?'<span class="tag">'+esc(a.category)+'</span> ':"")+(a.due_date?'<span class="tag gold">Due '+esc(a.due_date)+'</span>':"")+'<div>'+esc(a.note||"")+'</div>'+(a.category?'<button class="btn sm alt" data-cat="'+esc(a.category)+'" style="margin-top:6px">Practise this topic</button>':"")+'</div>'}).join(""):'<p class="sub">No homework right now.</p>';
  stats();rw();
}
function rw(){var c=$("cat").value;pool=c==="All topics"?WORDS:WORDS.filter(function(w){return w.category===c});
  if(!pool.length){$("wb").innerHTML='<p class="sub">No words yet. Your teacher will add some.</p>';$("pt").textContent="";$("pb").style.width="0";return}
  ix=ix%pool.length;var k=pool.filter(function(w){return KNOWN[w.id]}).length;$("pb").style.width=Math.round(k/pool.length*100)+"%";$("pt").textContent=k+" of "+pool.length+" words known";
  document.querySelectorAll("[data-m]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.m===mode)});
  mode==="cards"?cards():ask()}
function cards(){var w=pool[ix];$("wb").innerHTML='<button class="flash" id="fc">'+(flip?'<div class="r">'+esc(w.roman)+'</div><div style="font-size:1.3rem">'+esc(w.meaning)+'</div>':'<div class="w fa">'+esc(w.farsi)+'</div><div class="sub">Tap to flip</div>')+'</button><div class="row"><button class="btn alt" id="pv">Previous</button><button class="btn alt" id="nx">Next</button><button class="btn sf" id="hr">Hear it</button><button class="btn" id="kn">'+(KNOWN[w.id]?"Marked as known":"I know this")+'</button><span class="sub" style="margin:0">'+(ix+1)+' / '+pool.length+'</span></div>'}
function ask(){if(pool.length<4){$("wb").innerHTML='<p class="sub">Choose a topic with at least 4 words.</p>';return}done=false;cur=pool[Math.floor(Math.random()*pool.length)];var o=[cur];while(o.length<4){var x=pool[Math.floor(Math.random()*pool.length)];if(o.indexOf(x)<0)o.push(x)}
  $("wb").innerHTML='<div style="text-align:center"><div class="fa" style="font-size:3rem;font-weight:800">'+esc(cur.farsi)+'</div><div class="opts">'+shuf(o).map(function(w){return '<button class="opt" data-e="'+esc(w.meaning)+'">'+esc(w.meaning)+'</button>'}).join("")+'</div><div class="row" style="justify-content:center"><button class="btn alt" id="qn">Next question</button></div></div>'}
$("wb").onclick=async function(e){var b=e.target.closest("button");if(!b)return;var id=b.id,w=pool[ix];
  if(id==="fc"){flip=!flip;cards()}else if(id==="nx"){ix=(ix+1)%pool.length;flip=false;cards()}else if(id==="pv"){ix=(ix-1+pool.length)%pool.length;flip=false;cards()}
  else if(id==="hr")say(mode==="cards"?w.farsi:cur.farsi);
  else if(id==="kn"){if(!KNOWN[w.id]){var r=await sb.from("known_words").insert({user_id:U.id,word_id:w.id});if(!r.error){KNOWN[w.id]=1;addXp(5)}else toast(r.error.message)}rw()}
  else if(id==="qn")ask();
  else if(b.classList.contains("opt")&&!done){done=true;var ok=b.dataset.e===cur.meaning;b.classList.add(ok?"ok":"no");if(!ok)[].forEach.call($("wb").querySelectorAll(".opt"),function(x){if(x.dataset.e===cur.meaning)x.classList.add("ok")});if(ok)addXp(10);say(cur.farsi)}};
document.querySelector(".panel [data-m]").parentNode.onclick=function(e){var b=e.target.closest("[data-m]");if(b){mode=b.dataset.m;rw()}};
$("cat").onchange=function(){ix=0;flip=false;rw()};
$("as").onclick=function(e){var b=e.target.closest("[data-cat]");if(b){$("cat").value=b.dataset.cat;ix=0;mode="cards";flip=false;rw();$("cat").scrollIntoView({behavior:"smooth"})}};
$("sn").onclick=async function(){var n=$("nm").value.trim();if(!n)return;var r=await sb.from("profiles").update({full_name:n}).eq("id",U.id);r.error?toast(r.error.message):(P.full_name=n,$("hi").textContent="Welcome, "+n,toast("Saved"))};
$("ne").onchange=async function(){var r=await sb.from("profiles").update({notify_email:$("ne").checked}).eq("id",U.id);r.error?(toast(r.error.message),$("ne").checked=!$("ne").checked):toast($("ne").checked?"Email notifications on":"Email notifications off")};
$("out").onclick=signOut;
init();
</script></body></html>
